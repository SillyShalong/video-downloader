apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

/*
 * 发布用的签名密钥。每个版本都用同一把密钥签名，新版本才能直接装到旧版本上面（不卸载，设置和历史记录都留着）。
 * 密钥不放在仓库里：CI 从 GitHub Actions 的 secrets 取，本机打发布包时自己设置这几个环境变量：
 *   VD_KEYSTORE_PATH      密钥库文件（PKCS12）
 *   VD_KEYSTORE_PASSWORD  密钥库的口令（PKCS12 里密钥的口令和它相同）
 *   VD_KEY_ALIAS          密钥的别名
 * 没有这些变量时就是 Android SDK 默认的调试密钥 —— 每台机器各不相同，装不到已发布的版本上面，只适合自己开发调试。
 */
def signingEnv = [
    storePath: System.getenv('VD_KEYSTORE_PATH'),
    storePassword: System.getenv('VD_KEYSTORE_PASSWORD'),
    alias: System.getenv('VD_KEY_ALIAS'),
]
if (signingEnv.storePath && !(signingEnv.storePassword && signingEnv.alias)) {
    throw new GradleException('指定了 VD_KEYSTORE_PATH，就要同时给出 VD_KEYSTORE_PASSWORD 和 VD_KEY_ALIAS')
}

android {
    namespace = "com.sillyshalong.videodownloader"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.sillyshalong.videodownloader"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        published {
            if (signingEnv.storePath) {
                storeFile file(signingEnv.storePath)
                storePassword signingEnv.storePassword
                keyAlias signingEnv.alias
                keyPassword signingEnv.storePassword
            }
        }
    }
    buildTypes {
        debug {
            // 发布的就是 debug 这一类构建。给了发布密钥就用它签名（没给的话沿用默认的调试密钥）
            if (signingEnv.storePath) signingConfig signingConfigs.published
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (signingEnv.storePath) signingConfig signingConfigs.published
        }
    }
    testOptions {
        // JVM 单测可以用 -PvdFixtures=<目录> 或环境变量 VD_FIXTURES=<目录> 传入真实媒体文件目录
        // （MP4 重封装校验，见 tests/android-media-check.mjs），不传则跳过该用例
        unitTests.all { test ->
            def fixtures = project.findProperty("vdFixtures") ?: System.getenv("VD_FIXTURES") ?: ""
            test.systemProperty "vd.fixtures", fixtures
            // 环境变量不算任务输入：传了 fixtures 就总是重跑，免得 Gradle 判定「输入没变」而跳过
            if (fixtures) test.outputs.upToDateWhen { false }
        }
        // JVM 单测里碰到 android.util.Log 之类的调用时返回默认值（不抛「not mocked」）
        unitTests.returnDefaultValues = true
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // YouTube 取流：上游库自带的依赖（jsoup / nanojson / rhino）由它的 POM 声明，这里不用重复写
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.27.1'
    implementation 'org.mozilla:rhino:1.8.1'
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
