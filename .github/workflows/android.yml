name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:web

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # 媒体校验拿 ffmpeg 当参考实现（逐帧比对自研封装器的产物）
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Android unit tests (JVM)
        run: node scripts/android-gradle.mjs :app:testDebugUnitTest --no-daemon

      # 自研 MP4 封装器的产物必须与 ffmpeg 逐帧一致（带 B 帧的视频、分片 MP4、HLS 的 fMP4）
      - name: MP4 muxer vs ffmpeg (frame by frame)
        run: node tests/android-media-check.mjs

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename with version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "VideoDownloader-Android-v${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-android
          path: VideoDownloader-Android-*.apk

      - name: Attach to GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VideoDownloader-Android-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
